name: driver_app
description: "StudEx Driver App - WhatsApp-based ride-hailing driver companion"
publish_to: 'none'

version: 1.2.1+5

environment:
  sdk: ">=3.4.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.0
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  geolocator: ^13.0.0
  geocoding: ^3.0.0
  shared_preferences: ^2.3.0
  flutter_local_notifications: ^18.0.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo_studex.png
